services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apexgrid-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_NAME=ApexGrid F1 API
      - APP_VERSION=0.1.0
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost"]}
      - FASTF1_CACHE_DIR=/app/cache
    volumes:
      - fastf1_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - apexgrid-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: apexgrid-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apexgrid-net

volumes:
  fastf1_cache:
    name: apexgrid_fastf1_cache

networks:
  apexgrid-net:
    name: apexgrid_network
    driver: bridge
